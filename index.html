============================================================

1. 概率论基础

古典概型：有限等可能；P=m/n。
几何概型：长度、面积、体积比。
条件概率：P(A|B)=P(AB)/P(B)。
独立性：P(AB)=P(A)P(B)。
互斥：不能同时发生。
全概率公式：P(A)=ΣP(Bᵢ)P(A|Bᵢ)。
贝叶斯公式：P(Bᵢ|A)=P(Bᵢ)P(A|Bᵢ)/P(A)。

分布列：P(X=xᵢ)=pᵢ。

指数分布：f=λe^(-λx)。
正态分布：N(μ,σ²)；钟形。

t分布：小样本。

协方差：Cov(X,Y)=E[(X-EX)(Y-EY)]。
相关系数：ρ=Cov/(σ_Xσ_Y)。

母函数：概率母函数、矩母函数。

4. 极限定理

台体体积：V=h(S₁+√(S₁S₂)+S₂)/3
球体积：V=4/3πR³
球表面积：S=4πR²
圆柱侧面积：S=2πrh
圆柱全面积：S=2πr²+2πrh
圆锥侧面积：S=πrl
圆锥全面积：S=πr²+πrl
圆台侧面积：S=π(r₁+r₂)l
棱柱体积：V=Sh
棱锥体积：V=Sh/3
棱台体积：V=h(S₁+√(S₁S₂)+S₂)/3
欧拉公式：V-E+F=2
空间线面角：sinθ=|a·n|/(|a||n|)
二面角：cosθ=|n₁·n₂|/(|n₁||n₂|)
点面距：d=|Ax₀+By₀+Cz₀+D|/√(A²+B²+C²)

6. 高等几何
曲率：κ=|r'×r''|/|r'|³
挠率：τ=(r'×r'')·r'''/|r'×r''|²
Frenet 公式：T'=κN，N'=-κT+τB，B'=-τN
高斯曲率：K=(LN-M²)/(EG-F²)
测地线：曲面上短程线，满足测地曲率为 0
高斯-博内：∫_S K dA+∫_∂S κ_g ds=2πχ(S)
欧拉示性数：χ=V-E+F
同胚：连续双射且逆连续
基本群：π₁(X,x₀)
覆盖空间：p: E→B 局部同胚

============================================================
三、概率与统计
============================================================

1. 概率基础
古典概型：P(A)=m/n
几何概型：P(A)=测度比
概率加法：P(A∪B)=P(A)+P(B)-P(A∩B)
互斥：P(A∪B)=P(A)+P(B)
条件概率：P(A|B)=P(AB)/P(B)
乘法公式：P(AB)=P(A|B)P(B)
独立性：P(AB)=P(A)P(B)
全概率公式：P(A)=ΣP(Bᵢ)P(A|Bᵢ)
贝叶斯公式：P(Bᵢ|A)=P(Bᵢ)P(A|Bᵢ)/ΣP(Bⱼ)P(A|Bⱼ)

2. 随机变量与分布
分布函数：F(x)=P(X≤x)
离散型：P(X=xᵢ)=pᵢ，Σpᵢ=1
连续型：f(x)≥0，∫_{-∞}^{∞}f(x)dx=1
0-1 分布：E=p，Var=p(1-p)
二项分布：X~B(n,p)，P=C(n,k)p^k(1-p)^(n-k)
二项分布：E=np，Var=np(1-p)
泊松分布：X~P(λ)，P(X=k)=λ^k e^(-λ)/k!
泊松分布：E=λ，Var=λ
超几何分布：P=C(M,k)C(N-M,n-k)/C(N,n)
均匀分布：X~U(a,b)，f=1/(b-a)
均匀分布：E=(a+b)/2，Var=(b-a)²/12
指数分布：f=λe^(-λx)，x≥0
指数分布：E=1/λ，Var=1/λ²
正态分布：X~N(μ,σ²)
正态密度：f=1/(σ√(2π))e^(-(x-μ)²/(2σ²))
标准正态：Z=(X-μ)/σ~N(0,1)
正态分布：E=μ，Var=σ²
卡方分布：χ²(n)
t 分布：t(n)
F 分布：F(n₁,n₂)

3. 数字特征
期望：E(X)=Σxᵢpᵢ 或 ∫xf(x)dx
期望线性：E(aX+b)=aE(X)+b
期望线性：E(X+Y)=E(X)+E(Y)
方差：Var(X)=E[(X-E(X))²]=E(X²)-[E(X)]²
方差性质：Var(aX+b)=a²Var(X)
协方差：Cov(X,Y)=E[(X-EX)(Y-EY)]
协方差：Cov(X,Y)=E(XY)-E(X)E(Y)
相关系数：ρ=Cov(X,Y)/(σ_Xσ_Y)
独立 ⇒ 不相关；不相关不一定独立
二项分布方差推导：Var=np(1-p)

4. 极限定理
大数定律：样本均值依概率收敛于期望
中心极限定理：独立同分布，n 大时 (X̄-μ)/(σ/√n) 近似 N(0,1)
棣莫弗-拉普拉斯：二项分布近似正态

5. 数理统计
样本均值：x̄=(1/n)Σxᵢ
样本方差：s²=1/(n-1)Σ(xᵢ-x̄)²
样本标准差：s=√s²
t 统计量：t=(x̄-μ)/(s/√n)
χ² 统计量：χ²=Σ(O-E)²/E
F 统计量：F=s₁²/s₂²
点估计：矩估计、最大似然估计
区间估计：x̄±z_{α/2}·σ/√n
回归直线：y=a+bx
回归系数：b=Σ(xᵢ-x̄)(yᵢ-ȳ)/Σ(xᵢ-x̄)²
回归截距：a=ȳ-bx̄
相关系数：r=Σ(xᵢ-x̄)(yᵢ-ȳ)/√[Σ(xᵢ-x̄)²Σ(yᵢ-ȳ)²]

6. 随机过程
马尔可夫性：P(X_{n+1}=j|X_n=i,X_{n-1},…)=P(X_{n+1}=j|X_n=i)
转移概率：p_{ij}=P(X_{n+1}=j|X_n=i)
泊松过程：N(t)~P(λt)
布朗运动：B(t)~N(0,t)，独立增量
鞅：E(X_{n+1}|F_n)=X_n
平稳过程：均值、协方差函数不随时间平移变化

============================================================
结束

};

/* ============================================================
   解析：按 ===== 分割章节
   ============================================================ */
function detectSectionGroup(line) {
  const t = line.trim();
  if (/^(?:数与代数|图形与几何|概率与统计)$/.test(t)) {
    if (t === '数与代数') return '数与代数';
    if (t === '图形与几何') return '图形与几何';
    if (t === '概率与统计') return '概率与统计';
  }
  const m = t.match(/^(?:一|二|三|四|五|六|七|八|九|十|十一|十二|[1-9]\d*)[、. ]*(数与代数|图形与几何|概率与统计)$/);
  if (!m) return null;
  return m[1];
}

function getSectionTitle(line) {
  const t = line.trim();
  if (/^(一|二|三|四|五|六|七|八|九|十|十一|十二)、/.test(t) ||
      /^\d+\.\s*\S/.test(t) && t.length < 40) {
    return t;
  }
  return null;
}

function parseSections(text) {
  const sections = [];
  const lines = text.split('\n');
  let current = null;
  let currentGroup = '其他';

  for (let line of lines) {
    const trimmed = line.trim();

    if (/^={10,}/.test(trimmed)) {
      if (current && current.content.trim()) sections.push(current);
      current = null;
      continue;
    }

    const group = detectSectionGroup(trimmed);
    if (group) {
      currentGroup = group;
      continue;
    }

    const title = getSectionTitle(trimmed);
    if (title) {
      if (current && current.content.trim()) {
        sections.push(current);
      }
      current = { title, content: '', group: currentGroup };
      continue;
    }

    if (current) current.content += line + '\n';
  }

  if (current && current.content.trim()) sections.push(current);

  const seen = new Set();
  return sections.filter(sec => {
    const key = `${sec.group}|${sec.title}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

/* ============================================================
   构建左侧目录
   ============================================================ */
const nav = document.getElementById('nav');
const content = document.getElementById('content');
const allSections = [];
const groupOrder = ['数与代数', '图形与几何', '概率与统计', '其他'];
nav.innerHTML = `
  <div class="nav-intro">课程目录 · COURSE OUTLINE</div>
  <div class="nav-legend">
    <span><i class="chapter-flag focus" aria-hidden="true">★</i> 重点</span>
    <span><i class="chapter-flag challenge" aria-hidden="true">◆</i> 难点</span>
  </div>`;

function getChapterMarkers(sec) {
  const title = sec.title;
  const focus = /数系|基本运算|方程|函数|三角|数列|排列组合|概率|随机变量|数字特征|数理统计|平面几何|解析几何|立体几何|向量/.test(title);
  const challenge = /微积分|线性代数|抽象代数|高等几何|解析几何|随机变量|数字特征|立体几何|向量|三角/.test(title);
  return { focus, challenge };
}

function createMarker(className, symbol, label) {
  const marker = document.createElement('span');
  marker.className = `chapter-flag ${className}`;
  marker.textContent = symbol;
  marker.title = label;
  marker.setAttribute('aria-label', label);
  return marker;
}

function buildSectionNode(sec, record) {
  const div = document.createElement('button');
  div.type = 'button';
  div.className = 'section';
  div.dataset.book = record.book;
  div.dataset.index = record.index;
  div.setAttribute('aria-label', `${sec.title}${record.markers.focus ? '，重点' : ''}${record.markers.challenge ? '，难点' : ''}`);

  const badge = document.createElement('span');
  badge.className = 'section-badge';
  badge.textContent = String(record.number);

  const text = document.createElement('span');
  text.className = 'section-text';
  text.textContent = sec.title;

  const flags = document.createElement('span');
  flags.className = 'chapter-flags';
  if (record.markers.focus) flags.appendChild(createMarker('focus', '★', '重点'));
  if (record.markers.challenge) flags.appendChild(createMarker('challenge', '◆', '难点'));

  div.append(badge, text, flags);
  div.addEventListener('click', () => showSection(record.book, record.index, div));
  return div;
}

for (const bookName in DATA) {
  let bookSectionNumber = 0;
  const bookNode = document.createElement('div');
  bookNode.className = 'book-node';

  const bookTitle = document.createElement('button');
  bookTitle.type = 'button';
  bookTitle.className = 'book-title';
  bookTitle.setAttribute('aria-expanded', 'true');
  bookTitle.innerHTML = `<span aria-hidden="true">📕</span><span>${escapeHtml(bookName)}</span><span class="book-toggle" aria-hidden="true">▾</span>`;
  bookTitle.addEventListener('click', () => {
    const collapsed = bookNode.classList.toggle('collapsed');
    bookTitle.setAttribute('aria-expanded', String(!collapsed));
  });
  bookNode.appendChild(bookTitle);

  const bookBody = document.createElement('div');
  bookBody.className = 'book-body';

  const sections = parseSections(DATA[bookName]);
  const grouped = new Map();

  sections.forEach(sec => {
    const g = groupOrder.includes(sec.group) ? sec.group : '其他';
    if (!grouped.has(g)) grouped.set(g, []);
    grouped.get(g).push(sec);
  });

  const orderedGroups = [...groupOrder].filter(g => grouped.has(g));
  for (const group of [...new Set([...orderedGroups, ...grouped.keys()])]) {
    const groupWrap = document.createElement('div');
    groupWrap.className = 'group';

    const title = document.createElement('button');
    title.type = 'button';
    title.className = 'group-title';
    title.setAttribute('aria-expanded', 'true');
    title.innerHTML = `<span class="group-label"><i class="group-dot" aria-hidden="true"></i>${escapeHtml(group)}</span><span class="group-toggle" aria-hidden="true">▾</span>`;
    title.addEventListener('click', () => {
      const collapsed = groupWrap.classList.toggle('collapsed');
      title.setAttribute('aria-expanded', String(!collapsed));
    });
    groupWrap.appendChild(title);

    const body = document.createElement('div');
    body.className = 'group-body';

    const groupSections = grouped.get(group) || [];
    groupSections.forEach((sec) => {
      const record = {
        book: bookName,
        group,
        index: allSections.length,
        number: ++bookSectionNumber,
        title: sec.title,
        content: sec.content,
        markers: getChapterMarkers(sec)
      };
      allSections.push(record);
      body.appendChild(buildSectionNode(sec, record));
    });

    groupWrap.appendChild(body);
    bookBody.appendChild(groupWrap);
  }
  bookNode.appendChild(bookBody);
  nav.appendChild(bookNode);
}

/* ============================================================
   显示章节
   ============================================================ */
function showSection(bookName, idx, el) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');

  const sec = allSections.find(s => s.book === bookName && s.index === idx);
  if (!sec) return;
  const bookSections = allSections.filter(s => s.book === bookName);
  const position = bookSections.findIndex(s => s.index === idx);
  const previous = position > 0 ? bookSections[position - 1] : null;
  const next = position < bookSections.length - 1 ? bookSections[position + 1] : null;
  const markers = [
    sec.markers.focus ? '<span class="lesson-chip focus-chip">★ 重点</span>' : '',
    sec.markers.challenge ? '<span class="lesson-chip challenge-chip">◆ 难点</span>' : ''
  ].join('');
  content.innerHTML = `
    <article class="lesson-shell">
      <div class="lesson-topline">
        <span>${escapeHtml(sec.book)}</span><span aria-hidden="true">›</span>
        <span>${escapeHtml(sec.group)}</span><span aria-hidden="true">›</span>
        <span class="crumb-current">第 ${sec.number} 章</span>
      </div>
      <section class="lesson-hero">
        <div class="lesson-kicker">第 ${sec.number} 章 · ${escapeHtml(sec.group)}</div>
        <h2 class="lesson-title">${escapeHtml(sec.title)}</h2>
        <div class="lesson-meta">
          <span class="lesson-chip">${escapeHtml(sec.book)}</span>
          ${markers}
        </div>
      </section>
      <section class="lesson-content-card">
        <pre>${escapeHtml(sec.content)}</pre>
      </section>
      <div class="lesson-navigation">
        <button type="button" data-lesson-step="-1" ${previous ? '' : 'disabled'}>${previous ? `← 上一节：${escapeHtml(previous.title)}` : '已是本册第一节'}</button>
        <button type="button" data-lesson-step="1" ${next ? '' : 'disabled'}>${next ? `下一节：${escapeHtml(next.title)} →` : '已是本册最后一节'}</button>
      </div>
    </article>`;
  content.querySelectorAll('[data-lesson-step]').forEach(button => {
    button.addEventListener('click', () => {
      const target = bookSections[position + Number(button.dataset.lessonStep)];
      if (!target) return;
      const targetNode = Array.from(document.querySelectorAll('.section'))
        .find(node => Number(node.dataset.index) === target.index);
      showSection(target.book, target.index, targetNode);
    });
  });
  content.scrollTop = 0;
}

const themeToggle = document.getElementById('themeToggle');
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
document.body.dataset.theme = prefersDark ? 'dark' : 'light';

themeToggle.addEventListener('click', () => {
  const isDark = document.body.dataset.theme === 'dark';
  document.body.dataset.theme = isDark ? 'light' : 'dark';
  themeToggle.textContent = isDark ? '深色模式' : '浅色模式';
});

themeToggle.textContent = document.body.dataset.theme === 'dark' ? '浅色模式' : '深色模式';

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ============================================================
   搜索
   ============================================================ */
const searchInput = document.getElementById('search');
let searchTimer = null;

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 200);
});

function doSearch() {
  const kw = searchInput.value.trim();
  if (!kw) {
    content.innerHTML = `
      <div class="welcome">
        <div class="welcome-label">MATH LEARNING SPACE</div>
        <h2>欢迎来到数学学习空间</h2>
        <p>从左侧课程目录选择章节，循序学习数学知识与常用公式。</p>
        <p>也可以使用顶部搜索框，快速定位定理、概念和公式。</p>
        <div class="welcome-stats">
          <span class="welcome-stat">📚 两套学习资料</span>
          <span class="welcome-stat">🧭 三大学科模块</span>
          <span class="welcome-stat">🔎 章节与公式可搜索</span>
        </div>
      </div>`;
    return;
  }

  const lowerKw = kw.toLowerCase();
  const results = [];

  for (const sec of allSections) {
    const lines = sec.content.split('\n');
    const matched = [];
    lines.forEach(line => {
      if (line.toLowerCase().includes(lowerKw)) {
        matched.push(line);
      }
    });
    if (matched.length > 0 || sec.title.toLowerCase().includes(lowerKw)) {
      results.push({ sec, matched });
    }
  }

  if (results.length === 0) {
    content.innerHTML = `<h2>搜索：${escapeHtml(kw)}</h2><pre>未找到相关内容。</pre>`;
    return;
  }

  let html = `<h2>搜索：${escapeHtml(kw)} （共 ${results.length} 个章节）</h2>`;
  results.forEach(r => {
    html += `<h3 style="color:#4a69bd;margin:16px 0 8px;">【${escapeHtml(r.sec.book)}】${escapeHtml(r.sec.title)}</h3>`;
    html += '<pre>';
    if (r.matched.length > 0) {
      r.matched.slice(0, 30).forEach(line => {
        html += highlight(line, kw) + '\n';
      });
      if (r.matched.length > 30) html += `…（还有 ${r.matched.length - 30} 行匹配）\n`;
    } else {
      html += '（标题匹配）\n';
    }
    html += '</pre>';
  });
  content.innerHTML = html;
  content.scrollTop = 0;
}

function highlight(text, kw) {
  const escaped = escapeHtml(text);
  const re = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}
